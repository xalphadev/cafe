services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cafe_db
    env_file: .env.production        # อ่าน POSTGRES_* โดยตรงจากไฟล์
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cafe_net

  # ── Next.js App ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe_app
    env_file: .env.production        # อ่าน DATABASE_URL และ secrets โดยตรงจากไฟล์
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cafe_net

  # ── Nginx reverse proxy ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: cafe_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - cafe_net
    # Reload nginx config every 6 hours (picks up renewed certs)
    command: >
      /bin/sh -c "
        while :; do
          sleep 6h &
          wait $${!}
          nginx -s reload
        done &
        nginx -g 'daemon off;'
      "

  # ── Certbot (auto-renew SSL certs) ──────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: cafe_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Auto-renew every 12 hours
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "
    networks:
      - cafe_net

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:

networks:
  cafe_net:
    driver: bridge
