services:
  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cafe_db
    env_file: .env.production        # อ่าน POSTGRES_* โดยตรงจากไฟล์
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cafe_net

  # ── Next.js App ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe_app
    env_file: .env.production
    ports:
      - "3001:3000"          # Caddy จะ proxy มาที่ port นี้
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cafe_net

volumes:
  postgres_data:

networks:
  cafe_net:
    driver: bridge
