services:
  # ── MinIO (S3) — รันเมื่อ: docker compose --profile minio up -d
  # ชื่อ cafe_minio / cafe_minio_data แยกจาก container โปรเจกต์อื่นบนเครื่องเดียวกัน
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    container_name: cafe_minio
    command: server /data --console-address ":9001"
    env_file: .env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cafeminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe_MinIO_Shop}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://storage.coffee.xalpha.co.th/minio-console}
    volumes:
      - cafe_minio_data:/data
    networks:
      - cafe_net
      - proxy_net   # ให้ Caddy proxy ได้
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO init — สร้าง bucket + เปิด public read (รันครั้งเดียวตอนเริ่ม) ──
  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    container_name: cafe_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cafeminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ChangeMe_MinIO_Shop}
      S3_BUCKET: ${S3_BUCKET:-shop}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set download local/$$S3_BUCKET &&
      echo '✓ MinIO bucket ready'
      "
    networks:
      - cafe_net
    restart: on-failure

  # ── PostgreSQL ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cafe_db
    env_file: .env.production        # อ่าน POSTGRES_* โดยตรงจากไฟล์
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafe_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cafe_net

  # ── Next.js App ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID}
        NEXT_PUBLIC_UPLOAD_IMAGE_HOSTNAME: ${NEXT_PUBLIC_UPLOAD_IMAGE_HOSTNAME}
    container_name: cafe_app
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cafe_net
      - proxy_net            # network เดียวกับ Caddy

volumes:
  postgres_data:
  cafe_minio_data:

networks:
  cafe_net:
    driver: bridge
  proxy_net:
    external: true          # network ที่ Caddy สร้างไว้แล้ว
